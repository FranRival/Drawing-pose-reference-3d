<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pose Generator</title>
<meta name="google-site-verification" content="PkLa_ViOo6FAHpvh8SacceMb95o9tePRdrqLNBz9X1M" />
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="container">
  <!-- PANEL IZQUIERDO -->
  <div class="left-panel">
    <h2>Perspectivas</h2>
    <div id="views"></div>

    <h3>Encuadre</h3>
    <div class="control">
      <select id="cameraShot">
        <option value="general" selected>Plano general</option>
        <option value="medio">Plano medio</option>
        <option value="primerPlano">Primer plano</option>
        <option value="cenital">Cenital</option>
        <option value="contrapicado">Contrapicado</option>
        <option value="picado">Picado</option>
      </select>
    </div>

    <h3>Malla</h3>
    <div class="control">
      <select id="meshMode">
        <option value="solid" selected>Sólido normal</option>
        <option value="solidWireframe">Sólido + malla</option>
        <option value="wireframeOnly">Solo malla</option>
      </select>
    </div>
    <div class="control">
      <label for="loomisGuideToggle">Guía de cabeza (Loomis)</label>
      <input type="checkbox" id="loomisGuideToggle">
    </div>
    <div class="control">
      <label for="loomisOcclusionToggle">Guía - solo parte visible (respetar oclusión)</label>
      <input type="checkbox" id="loomisOcclusionToggle" checked>
    </div>
    <div class="control">
      <label for="loomisOffsetX">Guía - ajuste horizontal (X)</label>
      <input type="range" id="loomisOffsetX" min="-1.5" max="1.5" step="0.05" value="0">
      <span id="loomisOffsetXValue">0</span>
    </div>
    <div class="control">
      <label for="loomisOffsetY">Guía - ajuste vertical (Y)</label>
      <input type="range" id="loomisOffsetY" min="-1.5" max="1.5" step="0.05" value="-0.75">
      <span id="loomisOffsetYValue">-0.75</span>
    </div>
    <div class="control">
      <label for="loomisOffsetZ">Guía - profundidad (Z)</label>
      <input type="range" id="loomisOffsetZ" min="-1.5" max="1.5" step="0.05" value="-0.50">
      <span id="loomisOffsetZValue">-0.50</span>
    </div>
    <div class="control">
      <label for="loomisScale">Guía - tamaño</label>
      <input type="range" id="loomisScale" min="0.3" max="2" step="0.05" value="0.80">
      <span id="loomisScaleValue">0.80</span>
    </div>

    <h3>Controles de Pose</h3>

    <div class="control">
      <label for="gizmoOpacity">Visibilidad de esferas</label>
      <input type="range" id="gizmoOpacity" min="0" max="1" step="0.05" value="1">
    </div>
    <div id="timelineContainer" class="control">
      <label for="timeline">Línea de tiempo (mover para revisar la animación)</label>
      <input type="range" id="timeline" min="0" max="1" step="0.01" value="0">
    </div>

    <div id="poseControlsContainer"></div>

    <!-- ===== NUEVO: PANEL DE ANIMACION / FOLIOSCOPIO ===== -->
    <h3>Animación (Folioscopio)</h3>

    <div class="control">
      <button id="btnAddKeyframe">● Grabar keyframe</button>
      <button id="btnClearKeyframes">Borrar todos</button>
      <span id="keyframeCount">0 keyframes</span>
    </div>

    <div class="control">
      <button id="btnPlay">▶ Reproducir</button>
    </div>

    <div class="control">
      <label for="frameCount">Frames a exportar</label>
      <select id="frameCount">
        <option value="12">12</option>
        <option value="24" selected>24</option>
      </select>

      <label for="imgFormat">Formato</label>
      <select id="imgFormat">
        <option value="png" selected>PNG</option>
        <option value="jpg">JPG</option>
      </select>
    </div>

    <div class="control">
      <label for="numberFrames">Numerar imágenes</label>
      <input type="checkbox" id="numberFrames" checked>
    </div>

    <div class="control">
      <button id="btnExportSequence">Exportar secuencia completa (.zip)</button>
    </div>
    <div class="control">
      <button id="btnExportKeyframes">Exportar solo keyframes (.zip)</button>
    </div>
  </div>

  <!-- PANEL DERECHO -->
  <div class="right-panel" style="position:relative;">
    <div id="viewer" style="position:relative;"></div>

    <!-- ✅ NUEVO: rectángulo que marca el área EXACTA que se exporta
         (coincide con el recorte real hecho en captureFrameBlob) -->
    <div id="captureAreaGuide" style="
        position:absolute;
        border:2px dashed #ffcc00;
        box-sizing:border-box;
        pointer-events:none;
        z-index:5;">
    </div>

    <!-- ✅ NUEVO: barra de poses preestablecidas, flotando sobre el visor -->
    <div id="posePresetsBar" style="
        position:absolute; top:0; left:0; right:0;
        display:flex; gap:6px; padding:8px;
        overflow-x:auto; white-space:nowrap;
        background:rgba(0,0,0,0.45);
        z-index:10;">
      <button class="posePresetBtn" data-preset="carrera">Carrera</button>
      <button class="posePresetBtn" data-preset="guardia">Guardia</button>
      <button class="posePresetBtn" data-preset="jab">Golpe recto</button>
      <button class="posePresetBtn" data-preset="patada">Patada frontal</button>
      <button class="posePresetBtn" data-preset="bloqueo">Bloqueo</button>
      <button class="posePresetBtn" data-preset="grito">Grito de poder</button>
      <button class="posePresetBtn" data-preset="agachado">Agachado combate</button>
    </div>

    <!-- ✅ NUEVO: footer con timeline de poses grabadas (tarjetas) -->
    <div id="poseTimelineBar" style="
        position:absolute; bottom:0; left:0; right:0;
        display:flex; align-items:center; gap:8px; padding:8px;
        background:rgba(0,0,0,0.45);
        z-index:10;">
      <button id="btnFooterSavePose">💾 Guardar pose</button>
      <div id="keyframeCardsContainer" style="
          display:flex; gap:6px; overflow-x:auto; white-space:nowrap; flex:1;">
      </div>
    </div>
  </div>
</div>

<script type="module" src="./main/core.js"></script>
</body>
</html>
