<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pose Generator</title>
<meta name="google-site-verification" content="PkLa_ViOo6FAHpvh8SacceMb95o9tePRdrqLNBz9X1M" />
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="container">
  <!-- PANEL IZQUIERDO -->
  <div class="left-panel">
    <h2>Perspectivas</h2>
    <div id="views"></div>

    <h3>Controles de Pose</h3>
    <div id="timelineContainer">
      <input type="range" id="timeline" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="control">
      <label for="headX">Cabeza arriba / abajo</label>
      <input type="range" id="headX" min="-1.5" max="1.5" step="0.01" value="0">
    </div>
    <div class="control">
      <label for="leftArmX">Brazo izquierdo</label>
      <input type="range" id="leftArmX" min="-2" max="2" step="0.01" value="0">
    </div>
    <div class="control">
      <label for="rightArmX">Brazo derecho</label>
      <input type="range" id="rightArmX" min="-2" max="2" step="0.01" value="0">
    </div>
    <div class="control">
      <label for="leftForeArmX">Antebrazo izquierdo</label>
      <input type="range" id="leftForeArmX" min="-2" max="2" step="0.01" value="0">
    </div>
    <div class="control">
      <label for="rightForeArmX">Antebrazo derecho</label>
      <input type="range" id="rightForeArmX" min="-2" max="2" step="0.01" value="0">
    </div>

    <!-- ===== NUEVO: PANEL DE ANIMACION / FOLIOSCOPIO ===== -->
    <h3>Animación (Folioscopio)</h3>

    <div class="control">
      <button id="btnAddKeyframe">● Grabar keyframe</button>
      <button id="btnClearKeyframes">Borrar todos</button>
      <span id="keyframeCount">0 keyframes</span>
    </div>

    <div class="control">
      <button id="btnPlay">▶ Reproducir</button>
    </div>

    <div class="control">
      <label for="frameCount">Frames a exportar</label>
      <select id="frameCount">
        <option value="12">12</option>
        <option value="24" selected>24</option>
      </select>

      <label for="imgFormat">Formato</label>
      <select id="imgFormat">
        <option value="png" selected>PNG</option>
        <option value="jpg">JPG</option>
      </select>
    </div>

    <div class="control">
      <button id="btnExportSequence">Exportar secuencia completa (.zip)</button>
    </div>
    <div class="control">
      <button id="btnExportKeyframes">Exportar solo keyframes (.zip)</button>
    </div>
  </div>

  <!-- PANEL DERECHO -->
  <div class="right-panel">
    <div id="viewer"></div>
  </div>
</div>

<script type="module" src="./main/core.js"></script>
</body>
</html>
